name: Backbeat Android

on:
  push:
    # Naming tags means branches must be named too, or branch pushes would stop building.
    branches: ['**']
    # Pushing a version tag (v1.2.0) publishes a GitHub release with the APK attached.
    # Path filters are not applied to tag pushes, so every such tag builds.
    tags: ['v[0-9]*']
    paths:
      - 'backbeat/**'
      - '!backbeat/**/*.md'
      - '.github/workflows/backbeat.yml'
  workflow_dispatch:

concurrency:
  group: backbeat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk: ${{ steps.apk.outputs.name }}
    defaults:
      run:
        working-directory: backbeat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the family signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GLIMMER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glimmer.jks"
            echo "GLIMMER_KEYSTORE_FILE=$RUNNER_TEMP/glimmer.jks" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::A release must be signed with the family key, or it cannot update an earlier install. Add the GLIMMER_KEYSTORE_BASE64 secret (see backbeat/README.md) and re-run."
            exit 1
          else
            echo "::warning::No GLIMMER_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key and cannot update an earlier install. See backbeat/README.md."
          fi

      - name: Choose the version name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "BACKBEAT_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "BACKBEAT_VERSION_NAME=0.1.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi

      - name: Test the engine, then build the release and preview APKs
        env:
          GLIMMER_KEYSTORE_PASSWORD: ${{ secrets.GLIMMER_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease assemblePreview

      # Backbeat has no business on the internet. This makes sure it never asks to go there,
      # and that it asks for nothing beyond the short list the manifest explains.
      - name: Check the app asks for no internet access, and nothing unexpected
        run: |
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee permissions.txt
          if grep -qE 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)' permissions.txt; then
            echo "::error::Backbeat must never request network access"
            exit 1
          fi
          allowed='FOREGROUND_SERVICE FOREGROUND_SERVICE_MEDIA_PLAYBACK POST_NOTIFICATIONS VIBRATE RECORD_AUDIO DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'
          unexpected=""
          for name in $(sed -n "s/^uses-permission: name='\(.*\)'$/\1/p" permissions.txt); do
            case " $allowed " in
              *" ${name##*.} "*) ;;
              *) unexpected="$unexpected $name" ;;
            esac
          done
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected permissions:$unexpected. Explain them in AndroidManifest.xml and add them here."
            exit 1
          fi

      - name: Name the APK
        id: apk
        run: |
          name="backbeat-$BACKBEAT_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: backbeat-apk
          path: backbeat/${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: backbeat-preview-apk
          path: backbeat/app/build/outputs/apk/preview/app-preview.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backbeat-apk
          path: dist

      - name: Attach the APK to the tag's release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK: ${{ needs.build.outputs.apk }}
        run: |
          sha256sum "$APK" > "$APK.sha256"
          # Re-running the workflow on the same tag refreshes the files rather than failing.
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Backbeat $TAG" --generate-notes
          fi
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber

  preview:
    name: Emulator screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backbeat-preview-apk
          path: preview-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash backbeat/scripts/emulator-preview.sh preview-apk/app-preview.apk preview-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backbeat-screenshots
          path: preview-out
          if-no-files-found: warn
          retention-days: 14

  # Repeats the screenshots as text in the log, for reviewers who can read logs but not artifacts.
  encoded-previews:
    name: Screenshots as text
    needs: preview
    if: always() && needs.preview.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: backbeat-screenshots
          path: shots
      - name: Print the screenshots
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/venv/bin/python" backbeat/scripts/encode-previews.py shots
